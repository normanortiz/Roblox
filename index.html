<script>
// Wait for everything to load (images, fonts, videos, etc.)
window.addEventListener('load', function() {

    // Ensure Jimmy and other critical images are loaded and positioned
    const jimmy = document.getElementById('jimmy');
    const logo = document.getElementById('logo');

    function checkImagesLoaded() {
        const jimmyImg = jimmy ? jimmy.querySelector('img') : null;
        const logoImg = logo ? logo.querySelector('img') : null;

        const jimmyReady = !jimmyImg || (jimmyImg.complete && jimmyImg.naturalHeight !== 0);
        const logoReady = !logoImg || (logoImg.complete && logoImg.naturalHeight !== 0);


        if (jimmyReady && logoReady) {

            // Give time for positions to be set
            setTimeout(function() {
                document.getElementById('c-loader').classList.add('loaded');

                // Fade the hero background up out of the black preloader over 1.5s.
                var bgImg = document.querySelector('.layer-background img');
                if (bgImg) bgImg.classList.add('is-visible');

                // Hand the badge over from the preloader to the hero: it is already centred
                // at the same size, so this reads as one continuous element.
                if (window.__runLogoIntro) window.__runLogoIntro();

                // Update scroll after preloader is hidden and force scroll to top on mobile
                if (window.locomotiveScroll) {
                    setTimeout(() => {
                        window.locomotiveScroll.scrollTo(0, { duration: 0, disableLerp: true });
                        window.locomotiveScroll.update();

                        // Additional update for mobile
                        setTimeout(() => {
                            window.locomotiveScroll.update();
                        }, 500);
                    }, 100);
                }
            }, 300);
        } else {
            // Check again in 50ms
            setTimeout(checkImagesLoaded, 50);
        }
    }

    // Start checking after a brief delay to allow setInitialPositions to run
    setTimeout(checkImagesLoaded, 200);
});

// Wait for page load
window.addEventListener('load', function() {

    // Initialize Locomotive Scroll
    const scrollContainer = document.querySelector('[data-scroll-container]');

    if (!scrollContainer) {
        return;
    }

    if (typeof LocomotiveScroll === 'undefined') {
        return;
    }

    let scroll;
    try {
        scroll = new LocomotiveScroll({
            el: scrollContainer,
            smooth: true,
            smartphone: {
                smooth: true
            },
            tablet: {
                smooth: true
            }
        });
        window.locomotiveScroll = scroll;
    } catch (error) {
        return;
    }

    // Get all elements
    const background = document.getElementById('background');
    const overlay = document.getElementById('overlay');
    // Scroll cue. Held hidden until the load-in finishes, so it does not sit on the black
    // screen while the hero is still assembling.
    const scrollCue = document.getElementById('scroll-cue');
    let scrollCueReady = false;
    /* Back-to-top. js/main.js toggles its .show class from a listener on ITS OWN
       LocomotiveScroll instance, which never receives the events this page actually
       scrolls with - so the button stayed permanently hidden. Driven from here instead. */
    const backToTop = document.getElementById('back-to-top');
    const logo = document.getElementById('logo');
    const persistentLogo = document.getElementById('persistent-logo');
    const jimmy = document.getElementById('jimmy');

    // Get all bills with their bill numbers
    const bills = [];
    for (let i = 1; i <= 13; i++) {
        const bill = document.getElementById('bill' + i);
        if (bill) {
            bill.dataset.billNumber = i; // Store bill number
            bills.push(bill);
        }
    }

    /* Per-bill scroll profile. Module scope because two places read it: the scroll
       handler below, and runBillsIntro(), which needs each bill's resting rotation
       and scale so the load-in burst lands exactly on the state scrolling expects. */
    const billAnimations = [
        { speed: 25, rotation: 1.2, sway: 8, initialRotate: 15 },
        { speed: 19, rotation: -2.0, sway: 10, initialRotate: 75 },
        { speed: 28, rotation: 1.6, sway: 6, initialRotate: 25 },
        { speed: 17, rotation: -0.25, sway: 9, initialRotate: -15 },
        { speed: 14, rotation: 0.2, sway: 11, initialRotate: 30 },
        { speed: 19, rotation: -0.35, sway: 7, initialRotate: -25 },
        { speed: 16, rotation: 0.28, sway: 8, initialRotate: 18 },
        { speed: 20, rotation: 0.4, sway: 12, initialRotate: -30 },
        { speed: 25, rotation: 0, sway: 5, initialRotate: 22 },
        { speed: 8, rotation: -2.0, sway: 15, initialRotate: -18 },
        { speed: 25, rotation: -1.5, sway: 4, initialRotate: 110 },
        { speed: 5, rotation: -0.32, sway: 9, initialRotate: -22 },
        { speed: 20, rotation: 2.5, sway: 7, initialRotate: -90 }
    ];

    // The transform a bill settles on at scroll 0 - identical to what the scroll
    // handler writes when scrollPercent is 0, so the burst hands over invisibly.
    const BILL_REST_SCALE = 0.95;
    function billRestTransform(billNum) {
        const anim = billAnimations[billNum];
        const rot = anim ? anim.initialRotate : 0;
        return 'translateY(0px) translateX(0px) rotate(' + rot + 'deg) scale(' + BILL_REST_SCALE + ')';
    }

    // Second bill wave, with a per-bill fall profile. `above` is how far above the
    // viewport top each one waits before it is released.
    const wave2 = [];
    const wave2Config = [
        // Slower than the first pass and deliberately widely spread: the fastest falls at
        // roughly 2.7x the speed of the slowest, and the release depths are staggered so
        // they trickle in rather than arriving as a block.
        { speed: 13, sway: 16, rot: 1.4,  rot0: 12,  above: 200, phase: 0 },
        { speed: 22, sway: 10, rot: -2.1, rot0: -40, above: 620, phase: 1.2 },
        { speed:  9, sway: 22, rot: 0.9,  rot0: 65,  above: 300, phase: 2.4 },
        { speed: 18, sway: 12, rot: -1.2, rot0: -15, above: 880, phase: 0.6 },
        { speed: 11, sway: 19, rot: 1.8,  rot0: 30,  above: 260, phase: 3.1 },
        { speed: 24, sway:  9, rot: -0.7, rot0: -70, above: 980, phase: 1.8 },
        { speed: 10, sway: 24, rot: 1.1,  rot0: 20,  above: 420, phase: 2.0 },
        { speed: 16, sway: 13, rot: -1.6, rot0: -25, above: 740, phase: 0.3 },
        { speed: 12, sway: 18, rot: 2.2,  rot0: 45,  above: 340, phase: 2.7 },
        { speed: 20, sway: 11, rot: -1.0, rot0: -55, above: 540, phase: 1.5 }
    ];
    for (let i = 1; i <= 10; i++) {
        const el = document.getElementById('wbill' + i);
        if (el) wave2.push(el);
    }

    /* Mobile-only bills. Viewport-anchored like the wave above - the scrollY term cancels
       the hero's motion, so they enter from the TOP edge of the screen and travel down it.
       `above` is how far over that edge each one waits, which staggers their entrances.

       Every speed is held below the rate the page itself scrolls (see the scroll block),
       so they always drift down more slowly than the scroll. Sway amplitude AND wavelength
       differ per bill, as do rotation direction and lane, so no two travel alike. */
    const mbills = [];
    const mbillConfig = [
        // `above` is how far over the top edge each waits, and with the speed beside it
        // that sets when it enters: the first crosses the edge almost as soon as the set
        // starts, the rest follow at intervals rather than arriving together.
        //
        // The two fast ones are the pair that renders OVER the figure; the two slow ones
        // pass BEHIND him. That pairing is set in CSS via z-index - see #mbill2, #mbill4.
        { speed: 12.0, sway: 22, swayF: 0.09, rot: 1.3,  rot0: 18,  above: 10, phase: 0   },  // fast, in front
        { speed:  6.3, sway: 12, swayF: 0.15, rot: -2.0, rot0: -36, above: 50, phase: 1.7 },  // slow, behind
        { speed: 10.5, sway: 28, swayF: 0.07, rot: 0.7,  rot0: 62,  above: 60, phase: 2.9 },  // fast, in front
        { speed:  4.3, sway: 16, swayF: 0.12, rot: -1.2, rot0: -22, above: 60, phase: 0.9 }   // slow, behind
    ];
    for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('mbill' + i);
        if (el) mbills.push(el);
    }

    // Get viewport height
    let vh = window.innerHeight;

    // The background is no longer driven by a transform scale - it is anchored bottom-centre
    // in CSS and the scroll handler animates its height directly. The old
    // calculateBackgroundScale()/backgroundInitialScale pair has been removed because a
    // scale could not express "pinned to an edge that is itself moving".

    // Logo settings
    let logoFinalSize = 150; // pixels width (desktop) - square badge, so also its height
    let logoFinalTop = 20; // pixels from top
    let logoFinalLeft = 40; // pixels from left

    // Calculate initial logo width (30% of viewport width)
    let logoInitialWidth = window.innerWidth * 0.4485;
    if (logoInitialWidth > 628) {
        logoInitialWidth = 628;
    }

    // Track hero section height for scroll calculations (hero is 150vh tall)
    let heroHeight = vh * 1.5;

    // Set initial positions via JavaScript (called on load and resize)
    // Declared here, above setInitialPositions, because that function reads them and runs
    // before the intro block below. As let/const they would otherwise be in the temporal
    // dead zone at that point - and typeof does not protect against that, it throws.
    let jimmyIntroDone = false;
    const INTRO_SCALE_FROM = 0.45;   // starts at 45% of his resting size
    const INTRO_SCALE_PEAK = 1.5;    // swells to 1.5x resting at the top of the arc

    function setInitialPositions() {
        // Update vh on each call (for resize events)
        vh = window.innerHeight;

        // Logo: Reset to CSS initial state, adjust size based on height
        if (logo) {
            const isMobile = window.innerWidth <= 860;
            logo.style.position = '';
            logo.style.left = '';
            logo.style.transform = '';
            // Square badge: width doubles as height, so size it off the viewport height
            // to guarantee it fits vertically. The scroll handler refines this immediately.
            // Mobile figures track the 59.39% resting width, so this transient
            // first paint matches the 59.39% the scroll handler settles on.
            const logoWidth = Math.min(vh * (isMobile ? 0.3024 : 0.6877), isMobile ? 259 : 628);
            logo.style.width = logoWidth + 'px';
            logo.style.maxWidth = logoWidth + 'px';
            // Centred, matching the intro and the scroll handler. Mobile sits 30px higher.
            if (isMobile) {
                logo.style.top = 'calc(50vh - 30px)';
            } else {
                logo.style.top = '';
            }
        }

        // Jimmy: positioned at bottom, reduced 5% in size, moved up 300px desktop (320px on mobile - 20px lower)
        if (jimmy) {
            const isMobile = window.innerWidth <= 860;
            const aspectRatio = window.innerWidth / window.innerHeight;
            // Mobile: 0.8x scale, Desktop: 1.1x scale (10% larger)
            const mobileScale = isMobile ? 0.8 : 1.1;
            const jimmyWidth = Math.min((window.innerHeight * 1.2 + 80) * 0.95 * mobileScale, 1600);
            // Mobile: 390px up, Desktop: 340px up (320 + 20 additional)
            const upOffset = isMobile ? 390 : 340;
            jimmy.style.width = jimmyWidth + 'px';
            jimmy.style.bottom = '0px';
            jimmy.style.left = '50%';
            // Park him at the load-in START state - below the fold and small. This used to
            // apply no scale at all, so he painted at full size for a frame or two before
            // the intro fired, which read as a large flash.
            if (typeof jimmyIntroDone !== "undefined" && !jimmyIntroDone) {
                jimmy.style.transform = jimmyTransform(vh * 1.15, jimmyRest().scale * INTRO_SCALE_FROM);
            } else {
                jimmy.style.transform = `translateX(-50%) translateY(calc(50% - ${upOffset}px))`;
            }
        }

        // Bills: spread across all areas
        const billPositions = [
            { top: 0.08, left: 0.05, rotate: 25 },
            { top: 0.10, left: 0.90, rotate: -30 },
            { top: 0.42, left: 0.08, rotate: 18 },
            { top: -10, left: -10, rotate: 0 },
            { top: 0.68, left: 0.88, rotate: 35 },
            { top: -10, left: -10, rotate: 0 },
            { top: 0.35, left: 0.92, rotate: 28 },
            { top: 0.18, left: 0.28, rotate: -35 },
            { top: 0.72, left: 0.10, rotate: 20 },
            { top: 0.02, left: 0.58, rotate: -25 },
            { top: 0.31, left: 0.68, rotate: 32 },
            { top: 0.12, left: 0.38, rotate: -18 },
            { top: 0.75, left: 0.85, rotate: -35 }
        ];

        bills.forEach((bill, index) => {
            const billNum = parseInt(bill.dataset.billNumber) - 1;
            if (billPositions[billNum]) {
                const pos = billPositions[billNum];
                bill.style.top = (vh * pos.top - (billNum === 12 ? 20 : 0)) + 'px';
                bill.style.left = (window.innerWidth * pos.left + (billNum === 10 ? 20 : 0)) + 'px';
                bill.style.transform = `rotate(${pos.rotate}deg)`;
            }
        });

    }

    // Call initial positioning
    setInitialPositions();

    // Re-arms whenever the user returns to the very top, so scrolling down again
    // replays the burst.
    let confettiArmed = true;

    /* LOGO LOAD-IN
       The badge arrives vertically centred at 85% size (matching the preloader exactly, so
       the handover is invisible) and grows to full size. It STAYS centred - it does not
       travel to a higher resting position; only scrolling moves it from here.
       The scroll handler ignores the logo until this flag flips, and any real scroll
       cancels the intro immediately so the two never fight over top/transform. */
    let logoIntroDone = false;

    /* Jimmy resting geometry, in one place. The load-in intro and the scroll handler both
       read from here, so his start scale/offset can never drift between the two. */
    function jimmyRest() {
        const isMobile = window.innerWidth <= 860;
        return {
            isMobile: isMobile,
            // Mobile 0.460 = 10% larger than the previous 0.418. This is the STARTING
            // size only; the end of the rise is the absolute finalScale further down,
            // so growing the start narrows the growth range rather than moving the end.
            scale: isMobile ? 0.460 : 0.356,
            // The centre line, then dropped by this fraction of a viewport so he starts
            // below the badge. Mobile 0.35 = the previous 0.40 less 5%.
            //
            // This term shifts him at EVERY scroll position, so lowering it by 5% raises
            // his start AND the end of his rise by the same 5% - which is what was asked
            // for here. finalMoveUp is deliberately left alone this time; correcting it
            // would have held the end still.
            baseOffset: heroHeight - (vh / 2) - (vh * (isMobile ? 0.35 : 0.45))
        };
    }
    function jimmyTransform(extraY, scale) {
        const m = jimmyRest();
        return 'translateX(-50%) translateY(calc(50% - ' + m.baseOffset + 'px + ' + extraY +
               'px)) scale(' + (scale || m.scale) + ')';
    }

    /* JIMMY LOAD-IN
       Fires 0.3s after the badge settles. He rises from below the fold, swelling to twice his
       resting size on the way up, then shrinks back onto it as he lands - the overshoot is an
       explicit middle keyframe rather than a side effect of an easing curve, which is why this
       uses the Web Animations API instead of a CSS transition (a transition can only ease
       between two values and cannot pass through a peak).
       Any real scroll cancels it, exactly like the badge intro. */
    let jimmyIntroAnim = null;

    // His resting bounding box, filled in by runJimmyIntro (see the note there).
    let jimmyRestRect = null;

    function runJimmyIntro() {
        if (!jimmy || jimmyIntroDone) return;

        const rest = jimmyRest();
        const s0 = rest.scale;
        const H = jimmy.offsetHeight || 0;

        // The element scales about its CENTRE (the scroll handler geometry depends on that,
        // so the origin must not change). pinBottom shifts the translate by exactly the
        // amount the bottom edge would otherwise move - half the layout height times the
        // scale difference - so growth happens UPWARD out of his feet.
        //
        // At the 2x peak that lifts his head far above the badge, covering it for a moment;
        // the run back down to `to` then keeps the bottom planted and brings the TOP edge
        // back down, which is the shrink-from-the-top.
        const pinBottom = function (s) { return (H * (s0 - s)) / 2; };

        const peakScale = s0 * INTRO_SCALE_PEAK;
        const from = jimmyTransform(vh * 1.15, s0 * INTRO_SCALE_FROM);
        const peak = jimmyTransform(pinBottom(peakScale), peakScale);  // towers up over the badge
        const to   = jimmyTransform(0, s0);                            // bottom held, top drops back

        jimmy.style.transition = '';

        if (typeof jimmy.animate !== 'function') {   // no WAAPI - just place him
            jimmy.style.transform = to;
            jimmyIntroDone = true;
            return;
        }

        /* Record where he ENDS UP, measured rather than derived, before the animation
           starts moving him. runBillsIntro reads this to place the burst origin behind
           him - by the time the bills launch he is mid-flight, so his live rect is
           useless for that. */
        jimmy.style.transform = to;
        void jimmy.offsetWidth;
        jimmyRestRect = jimmy.getBoundingClientRect();

        jimmyIntroAnim = jimmy.animate(
            [
                { transform: from, offset: 0,    easing: 'cubic-bezier(0.16, 0.84, 0.44, 1)' },
                { transform: peak, offset: 0.62, easing: 'cubic-bezier(0.36, 0, 0.66, -0.2)' },
                { transform: to,   offset: 1 }
            ],
            { duration: 1000, fill: 'none' }
        );

        // Set the underlying value straight away: the animation composites on top while it
        // plays, so he lands on this exact transform with no flash at the hand-off.
        jimmy.style.transform = to;

        jimmyIntroAnim.onfinish = function () {
            jimmyIntroAnim = null;
            jimmyIntroDone = true;
        };
    }
    window.__runJimmyIntro = runJimmyIntro;

    /* BILL LOAD-IN BURST
       Every bill starts collapsed at the centre of the viewport - which is behind the
       figure, since .layer-bill is z-index 5 and .layer-jimmy is 20 - then flies out to
       its resting spot, overshoots slightly and settles back into place.

       Bills parked off-screen by design (the -10 entries in billPositions) are skipped:
       they would be visible flying out to nowhere. They are just switched on in place.

       The burst runs on the Web Animations API rather than a CSS transition because a
       transition can only ease between two values and cannot pass THROUGH the overshoot. */
    let billsIntroDone = false;
    const BILL_BURST_MS = 900;       // per-bill flight time
    const BILL_BURST_STAGGER = 28;   // ms between successive bills leaving the centre
    const BILL_OVERSHOOT = 0.11;     // fraction of the flight travelled past the resting spot
    const BILL_START_SCALE = 0.16;   // size at the centre, as a fraction of the resting scale

    // `replay` re-runs the burst from the current resting layout; the load sequence
    // never passes it, so the burst plays once per page load.
    function runBillsIntro(replay) {
        if (billsIntroDone && !replay) return;
        billsIntroDone = true;

        /* Origin of the burst. Horizontally it is the centre of the screen, which is also
           where the figure stands. Vertically the true centre sits ABOVE his head on a tall
           viewport, so the bills would appear over his shoulder instead of from behind him;
           clamping the origin down to just inside his top edge keeps it hidden by him while
           staying as close to the centre of the screen as the layout allows. */
        let cx = window.innerWidth / 2;
        let cy = window.innerHeight / 2;
        if (jimmyRestRect && jimmyRestRect.width) {
            cx = jimmyRestRect.left + jimmyRestRect.width / 2;
            cy = Math.max(cy, jimmyRestRect.top + jimmyRestRect.height * 0.16);
        }

        bills.forEach(function (bill, i) {
            const billNum = parseInt(bill.dataset.billNumber) - 1;
            const rest = billRestTransform(billNum);
            const anim = billAnimations[billNum];
            const rot = anim ? anim.initialRotate : 0;

            // Measure from the resting state. Rotation and centre-origin scaling do not
            // move an element's centre, so this rect's centre IS the layout centre.
            bill.style.transform = rest;
            const r = bill.getBoundingClientRect();

            // Parked off-screen on purpose - show it, do not fly it.
            const offscreen = r.right < 0 || r.left > window.innerWidth ||
                              r.bottom < 0 || r.top > window.innerHeight;
            if (offscreen || !r.width) {
                bill.classList.add('is-burst');
                return;
            }

            // Vector from the bill's resting spot to the centre of the screen.
            const dx = cx - (r.left + r.width / 2);
            const dy = cy - (r.top + r.height / 2);

            const startScale = BILL_REST_SCALE * BILL_START_SCALE;
            const peakScale = BILL_REST_SCALE * 1.05;
            const tf = function (x, y, deg, s) {
                return 'translate(' + x + 'px, ' + y + 'px) rotate(' + deg + 'deg) scale(' + s + ')';
            };

            bill.classList.add('is-burst');
            bill.animate([
                {   // collapsed at the centre, behind the figure
                    transform: tf(dx, dy, rot - 40, startScale),
                    opacity: 0,
                    offset: 0,
                    easing: 'cubic-bezier(0.13, 0.75, 0.3, 1)'
                },
                {   // visible almost immediately so the flight itself reads
                    transform: tf(dx * 0.72, dy * 0.72, rot - 29, startScale + (BILL_REST_SCALE - startScale) * 0.34),
                    opacity: 1,
                    offset: 0.16
                },
                {   // slightly past the resting spot, still travelling outward
                    transform: tf(-dx * BILL_OVERSHOOT, -dy * BILL_OVERSHOOT, rot + 4, peakScale),
                    opacity: 1,
                    offset: 0.7,
                    easing: 'cubic-bezier(0.4, 0, 0.3, 1)'
                },
                {   // settle back onto the exact state the scroll handler expects
                    transform: tf(0, 0, rot, BILL_REST_SCALE),
                    opacity: 1,
                    offset: 1
                }
            ], {
                duration: BILL_BURST_MS,
                delay: i * BILL_BURST_STAGGER,
                fill: 'backwards'   // hold the centre pose during the stagger delay
            });
        });
    }
    window.__runBillsIntro = runBillsIntro;

    function runLogoIntro() {
        if (!logo || logoIntroDone) return;
        const isMobile = window.innerWidth <= 860;

        /* Starting state: centred, full resting width, scaled down on desktop so the badge
           grows into place. Mobile holds scale 1 throughout - its resting width already
           equals the preloader badge, so the handover is a straight swap at one size
           rather than a 17.6% growth away from the size the preloader ended on. */
        const introFrom = isMobile ? 1 : 0.85;
        logo.style.transition = 'none';
        logo.style.position = 'fixed';
        logo.style.left = '50%';
        logo.style.top = isMobile ? 'calc(50vh - 30px)' : '50vh';
        logo.style.width = isMobile ? '59.39%' : '44.85%';
        logo.style.maxWidth = isMobile ? 'none' : '628px';
        logo.style.transform = 'translate(-50%, -50%) scale(' + introFrom + ')';
        logo.style.opacity = '1';
        logo.style.zIndex = '8';   // below the figure, which renders on top

        // Commit that starting state before transitioning away from it.
        void logo.offsetWidth;

        logo.style.transition = 'transform 600ms cubic-bezier(0.22, 1, 0.36, 1)';

        requestAnimationFrame(function () {
            if (logoIntroDone) return;
            logo.style.transform = 'translate(-50%, -50%) scale(1)';   // grow, stays centred
            setTimeout(function () {
                logo.style.transition = '';
                logoIntroDone = true;
                // 0.3s beat, then he comes up from the bottom.
                setTimeout(function () {
                    if (window.__runJimmyIntro) window.__runJimmyIntro();
                    // Part-way into his rise he is covering the centre of the screen, so
                    // the bills genuinely emerge from behind him rather than beside him.
                    setTimeout(function () {
                        if (window.__runBillsIntro) window.__runBillsIntro();
                        // Hero is fully assembled - now invite the scroll.
                        if (scrollCue) {
                            scrollCueReady = true;
                            scrollCue.style.opacity = '1';
                        }
                    }, 450);
                }, 300);
            }, 700);
        });
    }
    window.__runLogoIntro = runLogoIntro;

    // Parallax animation on scroll
    scroll.on('scroll', (args) => {
        try {
            if (!args.scroll) return;

            const scrollY = args.scroll.y;

            if (!heroHeight || heroHeight === 0) {
                return;
            }
            const scrollPercent = Math.min((scrollY / heroHeight) * 100, 100);

        // CONFETTI: one-shot burst the moment the user starts scrolling down
        if (confettiArmed && scrollY > 30) {
            confettiArmed = false;
            if (window.__fireConfetti) window.__fireConfetti();
        } else if (!confettiArmed && scrollY <= 3) {
            confettiArmed = true;   // back at the top - ready to fire again
        }

        // PERSISTENT LOGO
        if (persistentLogo) {
            if (scrollPercent >= 80) {
                persistentLogo.classList.add('visible');
            } else {
                persistentLogo.classList.remove('visible');
            }
        }

        // 1. OVERLAY: Fades by 20% scroll
        if (overlay) {
            if (scrollPercent <= 20) {
                const progress = scrollPercent / 20;
                const opacity = 1 - progress;
                overlay.style.opacity = opacity;
            } else {
                overlay.style.opacity = 0;
            }
        }

        // 2. BACKGROUND
        // The image is anchored bottom-centre to the hero in CSS (bottom:0), so its bottom
        // edge IS the hero's bottom edge. That edge moves up as the page scrolls, and the
        // image tracks it automatically - no counter-translate, no compensation.
        //
        // The ONLY thing animated here is the height. Shrinking against a pinned bottom
        // pulls the top edge downward, which is what reads as the background easing down
        // while the page scrolls up. Once the shrink finishes at ANIM_END the height is
        // constant, so from then on the image simply rides with the hero - same direction,
        // same speed as the scroll.
        if (background && background.querySelector('img')) {
            const img = background.querySelector('img');
            const ANIM_END = 30;               // matches the figure's growth window
            const MAX_WIDTH_VISIBLE = 0.98;    // never show more than 98% of the image width
            const isMobile = window.innerWidth <= 860;
            const progress = Math.min(scrollPercent / ANIM_END, 1);

            // The image is held VISUALLY STATIC for the first ANIM_END% of the hero: it is
            // re-anchored to the viewport every frame, which cancels the page scroll exactly.
            // Because it then only has to cover the VIEWPORT rather than the whole 150vh hero,
            // the coverage floor is far shorter - and a shorter floor is a much narrower
            // image, which is what finally lets nearly the full width fit on screen.
            //
            //   SIZE_*  - image height as a multiple of the coverage floor. 1.0 = smallest
            //             possible (exactly covers). Larger = more zoomed in.
            //   *_DROP  - how far it is pushed below the viewport bottom. Position only.
            const SIZE_START = 1.30;   // at rest - a step further out than 1.425
            const SIZE_END   = 1.0;    // by ANIM_END - fully zoomed out, ~98% of the width
            // Mobile start 0.85 = 0.80 plus a further 5% of a viewport height.
            const START_DROP = vh * (isMobile ? 0.85 : 1.45);
            // Absolute, NOT derived from START_DROP. It used to be START_DROP + 0.10, which
            // meant every "lower the start" request silently dragged the ending position down
            // with it. 0.55 is where the end sat when it was last set deliberately.
            //
            // On mobile the width term below never wins, so the coverage floor IS vh + drop
            // and the image finishes at exactly its no-gap minimum. That makes the ending
            // size and the ending drop the same number - a lower end is necessarily a
            // larger, less zoomed-out end, because anything smaller would expose the top.
            // Mobile 0.50 = 0.40 plus a further 10% of a viewport height.
            const END_DROP   = vh * (isMobile ? 0.50 : 0.55);
            const drop = START_DROP + ((END_DROP - START_DROP) * progress);

            const heroPx = background.clientHeight || heroHeight;
            const aspect = (img.naturalWidth && img.naturalHeight)
                ? img.naturalWidth / img.naturalHeight
                : 2339 / 1792;

            // Floor: tall enough to cover the viewport (plus the drop), and wide enough that
            // no more than MAX_WIDTH_VISIBLE of the image is on screen. On any normal desktop
            // the width term wins, which is what pins the end state at ~98% of the width.
            const coverFloor = Math.max(vh + drop,
                                        window.innerWidth / (MAX_WIDTH_VISIBLE * aspect));

            const size = SIZE_START + ((SIZE_END - SIZE_START) * progress);
            const height = coverFloor * Math.max(size, 1);

            // Re-anchor to the viewport. CSS bottom is measured up from the hero's bottom
            // edge, so subtracting the scrolled distance keeps the image pinned to the
            // viewport instead of travelling with the hero. Frozen at ANIM_END, after which
            // it rides away with the page at 1:1 like any normal element.
            const compensated = Math.min(scrollY, heroHeight * (ANIM_END / 100));
            const bottomPx = heroPx - vh - compensated - drop;

            img.style.height = height + 'px';
            img.style.width = 'auto';
            img.style.bottom = bottomPx + 'px';
            img.style.transform = 'translateX(-50%)';
        }

        // 3. LOGO: rises and shrinks with the scroll.
        // Held off while the load-in intro is still playing (see runLogoIntro below), so the
        // two are never fighting over top/transform. Any real scroll cancels the intro.
        if (logo && (logoIntroDone || scrollPercent > 0)) {
            if (!logoIntroDone) {
                logoIntroDone = true;
                logo.style.transition = '';
            }
            const isMobile = window.innerWidth <= 860;
            const heroFullyScrolled = scrollY >= heroHeight;
            logo.style.position = 'fixed';

            // The logo is a square badge (1:1), so its width is also its height. It stays
            // horizontally centred at all times and simply travels straight up while fading
            // out - no move to the top-left corner, no shrink.
            const initialWidth = isMobile ? '59.39%' : '44.85%';
            const riseThreshold = isMobile ? 15 : 50;   // % of hero scrolled to complete the rise
            const riseDistance = isMobile ? 55 : 70;    // vh travelled upward over that range
            const minScale = 0.3;                       // size it shrinks to by the end of the rise
            const progress = Math.min(scrollPercent / riseThreshold, 1);
            const scale = 1 - ((1 - minScale) * progress);

            logo.style.width = initialWidth;
            logo.style.maxWidth = isMobile ? 'none' : '628px';
            logo.style.left = '50%';
            logo.style.top = isMobile ? 'calc(50vh - 30px)' : '50vh';   // stays centred; only scroll moves it
            // It rises and shrinks rather than fading - opacity stays at 1 throughout.
            // scale() comes after the translate so it shrinks about its own centre.
            logo.style.transform =
                `translate(-50%, calc(-50% - ${riseDistance * progress}vh)) scale(${scale})`;
            logo.style.opacity = '1';
            logo.style.zIndex = '8';   // below the figure, which renders on top
        }

        // 4. JIMMY: Increases in size. Skipped while the load-in bounce is still playing;
        // a real scroll cancels that intro so the two never fight over the transform.
        if (jimmy && (jimmyIntroDone || scrollPercent > 0)) {
            if (!jimmyIntroDone) {
                jimmyIntroDone = true;
                jimmy.style.transition = '';
                if (jimmyIntroAnim) { jimmyIntroAnim.cancel(); jimmyIntroAnim = null; }
            }
            const isMobile = window.innerWidth <= 860;
            const aspectRatio = window.innerWidth / window.innerHeight;
            const initialScale = jimmyRest().scale;
            // Negative = upward. These used to be +30 on the default desktop case, i.e. it
            // drifted DOWN; it now climbs on every breakpoint.
            let finalMoveUp = -270;      // 60px lower than the previous -330 end point
            let finalScale = 0.622;      // 40% smaller than the previous 1.037 end
            // Starting position lift: desktop 30% of viewport height, mobile 30%. Larger
            // value = higher, since it is subtracted in the translateY below.
            // Centres him vertically on screen at rest. The layer is bottom-anchored to the
            // 150vh hero and translateY(50%) puts its centre on the container's bottom edge,
            // so the visual centre works out to containerBottom - baseOffset. Setting
            // baseOffset = heroHeight - half a viewport therefore lands it on 50vh - the same
            // line the badge sits on.
            // Centre line, then dropped 45% of a viewport so he starts lower than the badge.
            const baseOffset = jimmyRest().baseOffset;

            if (isMobile) {
                finalMoveUp = -370;
                finalScale = 0.736;   // 5% smaller than the 0.775 it ended at before
            } else if (aspectRatio > 16/9) {
                finalMoveUp = -315;
                finalScale = 0.699;   // 40% smaller than 1.165
            }

            // End position drop, as a fraction of the viewport height. Less negative = lower.
            // Applies only to where he ENDS UP: moveUp below is scaled by riseProgress, so
            // the resting position at scroll 0 is untouched.
            if (!isMobile) {
                // 0.40 = the previous 0.50 less the 0.10 that baseOffset just gained.
                // baseOffset shifts him at EVERY scroll position, so without this the lower
                // start would drag the ending position down with it.
                finalMoveUp += vh * 0.40;
            } else {
                // 0.58 = the 0.55 this sat at, plus 3% of a viewport height to lower the
                // end of his rise. Folded into the same constant is the 0.05 correction
                // for the lift baseOffset gives his start - that has to stay, or changing
                // his starting position drags the ending position along too.
                finalMoveUp += vh * 0.58;
            }

            // Reaches full size by 30% of the hero scroll (was 58.5%), and the rise runs on
            // an even shorter window so he still climbs faster than he expands.
            // Rise and growth share one window so he grows for exactly as long as he moves,
            // and both finish with the badge and background at ANIM_END. Spreading the rise
            // over 30% rather than 20% is also what stops him sagging: the movement is
            // outrun by the page scrolling up beneath him, so the net travel is upward.
            const riseProgress = Math.min(scrollPercent / 30, 1);
            const growProgress = Math.min(scrollPercent / 30, 1);
            const moveUp = finalMoveUp * riseProgress;
            const scale = initialScale + ((finalScale - initialScale) * growProgress);
            // Purely vertical: translateX stays at a flat -50% so he never drifts sideways.
            // The old finalMoveLeft (-40 desktop, -20 ultrawide) has been removed entirely.
            jimmy.style.transform = `translateX(-50%) translateY(calc(50% - ${baseOffset}px + ${moveUp}px)) scale(${scale})`;
        }

        // 5b. SECOND BILL WAVE - nothing until WAVE_START% of the hero (20%), then they drop in
        // from the top of the screen and keep falling for the rest of the scroll.
        // `scrollY - above` is what places them relative to the VIEWPORT top rather than a
        // fixed point in the hero, so they always enter from the screen edge.
        if (wave2.length) {
            const WAVE_START = 20;
            const past = Math.max(0, scrollPercent - WAVE_START);
            for (let i = 0; i < wave2.length; i++) {
                const el = wave2[i], cfg = wave2Config[i];
                if (past <= 0) {
                    el.style.opacity = '0';
                    continue;
                }
                const fall = past * cfg.speed;
                const swayX = Math.sin((past + cfg.phase) * 0.14) * cfg.sway;
                const rot = cfg.rot0 + (past * cfg.rot);
                const y = scrollY - cfg.above + fall;
                el.style.transform = 'translate3d(' + swayX + 'px, ' + y + 'px, 0) rotate(' + rot + 'deg)';
                el.style.opacity = Math.min(past / 4, 1);
            }
        }

        // 5e. BACK TO TOP - visible once the page has moved past the first 150px.
        if (backToTop) {
            backToTop.classList.toggle('show', scrollY > 150);
        }

        // 5d. SCROLL CUE - out as soon as the page moves at all. Binary rather than
        // proportional: the CSS transition does the smoothing, so this reads as a quick
        // fade the instant scrolling starts, and it returns on the way back to the top.
        if (scrollCue && scrollCueReady) {
            scrollCue.style.opacity = scrollPercent > 0.5 ? '0' : '1';
        }

        // 5c. MOBILE BILLS - four of them, and the only bills mobile shows. Viewport-anchored:
        // the scrollY term cancels the hero's motion, so each enters from the TOP edge of the
        // screen and travels down it, never appearing mid-screen out of nowhere. Desktop
        // leaves them alone entirely - CSS keeps them display:none there.
        if (mbills.length && window.innerWidth <= 860) {
            const MB_START = 10;                         // % of hero before they begin
            const past = Math.max(0, scrollPercent - MB_START);
            // px of page movement per 1% of hero. Capping every fall speed below this
            // guarantees a bill always drifts down more slowly than the page scrolls,
            // on any viewport height - not just the one this was tuned on.
            const scrollRate = heroHeight / 100;
            for (let i = 0; i < mbills.length; i++) {
                const el = mbills[i], cfg = mbillConfig[i];
                const elH = el.offsetHeight || 0;
                if (past <= 0) {
                    // Park above the top edge rather than at y=0, so the first frame after
                    // MB_START does not jump into place as it fades in.
                    el.style.transform = 'translate3d(0px, ' + (scrollY - cfg.above) + 'px, 0) rotate(' + cfg.rot0 + 'deg)';
                    el.style.opacity = '0';
                    continue;
                }
                // 0.95, not 1.0: the two fast bills sit close to the page's own rate, and
                // this keeps even them drifting down more slowly than the scroll.
                const speed = Math.min(cfg.speed, scrollRate * 0.95);
                const fall = past * speed;
                const swayX = Math.sin((past + cfg.phase) * cfg.swayF) * cfg.sway;
                const rot = cfg.rot0 + (past * cfg.rot);

                // The hero is overflow:hidden, and its bottom edge climbs the screen as you
                // scroll, so the band a bill can occupy shrinks. Fade out over the last
                // 140px of that band and clamp at it, rather than being sliced off mid-air.
                const maxY = heroHeight - elH - 4;
                let y = scrollY - cfg.above + fall;
                const fade = y > maxY - 140 ? Math.max(0, (maxY - y) / 140) : 1;
                y = Math.min(y, maxY);

                el.style.transform = 'translate3d(' + swayX + 'px, ' + y + 'px, 0) rotate(' + rot + 'deg)';
                el.style.opacity = Math.min(past / 5, 1) * fade;
            }
        }

        // 5. BILLS: Confetti-like falling motion (billAnimations is declared at the
        // top of this script - see the note there about the load-in burst sharing it)
        bills.forEach((bill, index) => {
            const billNum = parseInt(bill.dataset.billNumber) - 1;
            if (billAnimations[billNum]) {
                const anim = billAnimations[billNum];
                const fallDistance = scrollPercent * anim.speed;
                const rotationIncrease = scrollPercent * anim.rotation;

                let swayOffset;
                if (billNum === 1) {
                    swayOffset = scrollPercent * 8;
                } else if (billNum === 2) {
                    swayOffset = scrollPercent * 5;
                } else if (billNum === 8) {
                    swayOffset = scrollPercent * 8;
                } else if (billNum === 9) {
                    swayOffset = scrollPercent * 10;
                } else if (billNum === 10) {
                    swayOffset = scrollPercent * 12;
                } else if (billNum === 11) {
                    swayOffset = scrollPercent * 10;
                } else {
                    swayOffset = Math.sin(scrollPercent * 0.08) * anim.sway;
                }

                const loopedFallDistance = fallDistance % (vh * 2);
                const billProgress = Math.min(scrollPercent / 60, 1);
                let billScale = 0.95 + (0.65 * billProgress);

                if (billNum === 9) {
                    billScale = 0.95 - (0.4 * billProgress);
                }
                if (billNum === 2) {
                    billScale = 0.95 + (0.85 * billProgress);
                }
                if (billNum === 10) {
                    billScale = 0.95 + (0.85 * billProgress);
                }

                bill.style.transform = `translateY(${loopedFallDistance}px) translateX(${swayOffset}px) rotate(${anim.initialRotate + rotationIncrease}deg) scale(${billScale})`;
            }
        });
        } catch (error) {
        }
    });

    // Logo click - scroll to top
    if (logo) {
        logo.addEventListener('click', function() {
            scroll.scrollTo(0);
        });
    }

    // Persistent logo click - scroll to top
    if (persistentLogo) {
        persistentLogo.addEventListener('click', function() {
            scroll.scrollTo(0);
        });
    }

    // Update scroll on resize
    window.addEventListener('resize', function() {
        vh = window.innerHeight;
        heroHeight = vh * 1.5;
        // These were still the pre-resize logo values (0.54 / 720px), so any window resize
        // reverted the logo to its old size. They now match the constants used above.
        logoInitialWidth = window.innerWidth * 0.4485;
        if (logoInitialWidth > 628) {
            logoInitialWidth = 628;
        }
        // The background needs no recalculation here - it is sized from the live hero and
        // viewport dimensions on every scroll tick.
        setInitialPositions();
        scroll.update();
    });

    // Force initial update
    setTimeout(function() {
        scroll.update();
    }, 100);
});
</script>

<script>
/* CONFETTI BURST
   Paints #confetti-canvas, which spans the full 150vh hero at z-index 12 (behind the
   figure at z-index 20, so the burst reads as erupting from behind him).
   Exposes window.__fireConfetti(); the scroll handler above calls it when the user
   scrolls past 30px, and re-arms once they scroll back to the top. Self-terminating - the rAF loop stops and the canvas
   clears as soon as every piece has fallen past the bottom of the hero. */
(function () {
    const canvas = document.getElementById('confetti-canvas');
    const hero = document.getElementById('hero');
    if (!canvas || !hero || !canvas.getContext) return;

    const ctx = canvas.getContext('2d');
    const COLORS = ['#F5B71B', '#FFD84D', '#FFE9A8', '#FFFFFF', '#EDEDED',
                    '#00BCE7', '#E64783', '#8ED14F', '#B06CE8'];

    let particles = [];
    let running = false;
    let last = 0;
    let W = 0, H = 0;

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = hero.clientWidth;
        H = hero.clientHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function burst() {
        resize();
        const isMobile = W <= 860;
        // Origin sits at the figure's torso, mid-hero, so pieces fan out from behind him.
        const originX = W / 2;
        const originY = H * 0.6;
        const count = isMobile ? 680 : 1200;

        particles = [];
        for (let i = 0; i < count; i++) {
            // Fan biased upward but wide enough that pieces reach the hero's far corners.
            const angle = (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.7;
            const speed = (isMobile ? 8 : 11) + Math.random() * (isMobile ? 20 : 30);
            particles.push({
                x: originX + (Math.random() - 0.5) * W * 0.22,
                y: originY + (Math.random() - 0.5) * 110,
                vx: Math.cos(angle) * speed * (0.8 + Math.random() * 0.7),
                vy: Math.sin(angle) * speed,
                w: 6 + Math.random() * 9,
                h: 9 + Math.random() * 14,
                color: COLORS[(Math.random() * COLORS.length) | 0],
                rot: Math.random() * Math.PI * 2,
                vr: (Math.random() - 0.5) * 0.4,
                phase: Math.random() * Math.PI * 2,
                flutter: 0.05 + Math.random() * 0.1,
                drag: 0.984 + Math.random() * 0.012
            });
        }

        if (!running) {
            running = true;
            last = 0;
            requestAnimationFrame(tick);
        }
    }

    function tick(now) {
        // Normalise to a 60fps step so the burst behaves the same on any refresh rate.
        const dt = last ? Math.min((now - last) / 16.667, 2.5) : 1;
        last = now;

        ctx.clearRect(0, 0, W, H);
        let alive = 0;

        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.vy += 0.33 * dt;                       // gravity
            p.vx *= Math.pow(p.drag, dt);            // air resistance
            p.vy *= Math.pow(0.996, dt);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += p.vr * dt;
            p.phase += p.flutter * dt;

            if (p.y - p.h > H) continue;             // fallen out of the hero
            alive++;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.scale(1, Math.cos(p.phase));         // edge-on flutter as it tumbles
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
        }

        if (alive > 0) {
            requestAnimationFrame(tick);
        } else {
            running = false;
            particles = [];
            ctx.clearRect(0, 0, W, H);
        }
    }

    window.addEventListener('resize', function () { if (running) resize(); });
    window.__fireConfetti = burst;
})();
</script>

<!-- YOUTUBE CAPTION STRIPPING
     The cc_load_policy=0 URL parameter only sets a *default*; YouTube still applies the
     viewer's own caption preference on top of it, which is why captions reappear for some
     people. Unloading the caption modules through the IFrame Player API is what actually
     removes them. The video loops, so the modules are unloaded again on every state change
     rather than once on ready. -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
function onYouTubeIframeAPIReady() {
    if (!document.getElementById('bgVideo') || typeof YT === 'undefined') return;

    function stripCaptions(player) {
        try {
            player.unloadModule('captions');  // legacy module name
            player.unloadModule('cc');        // current module name
        } catch (e) {
            /* player not ready for module calls yet - the next state change retries */
        }
    }

    new YT.Player('bgVideo', {
        events: {
            onReady: function (e) {
                e.target.mute();
                stripCaptions(e.target);
                e.target.playVideo();
            },
            onStateChange: function (e) {
                stripCaptions(e.target);
            },
            onApiChange: function (e) {
                // Fires when modules load - the reliable moment to unload captions.
                stripCaptions(e.target);
            }
        }
    });
}
</script>
